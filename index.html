<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="main.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
      
  </head>
  <body>
    <div class="container">
      <div class="tudo">
        <div class="top">
          <h2>O que eu achei de. . .</h2>
          <button class="x"><i class="bi bi-x"></i></button>
        </div>

        <div class="bot">
          <div class="poster">
            <img class="movie" src="Steven Universe_ The Movie.jpeg" />
          </div>

          <div class="info">
            <div class="titulo">
              <h1>Steven Universe : The Movie</h1>
              <h3>2020</h3>
            </div>
            <div class="likes">
              <div class="lik">
                <span>Avaliação</span>
                <div class="stars">
                  <input type="radio" id="star5" name="rating" value="5" />
                  <label for="star5"><i class="bi bi-star"></i></label>

                  <input type="radio" id="star4" name="rating" value="4" />
                  <label for="star4"><i class="bi bi-star"></i></label>

                  <input type="radio" id="star3" name="rating" value="3" />
                  <label for="star3"><i class="bi bi-star"></i></label>

                  <input type="radio" id="star2" name="rating" value="2" />
                  <label for="star2"><i class="bi bi-star"></i></label>

                  <input type="radio" id="star1" name="rating" value="1" />
                  <label for="star1"><i class="bi bi-star"></i></label>
                </div>
              </div>
              <div class="lik">
                <span>Amei</span>
                <div class="cora">
    <input type="checkbox" id="favorite">
    <label for="favorite">
        <i class="bi bi-heart"></i>
    </label>
</div>
              </div>
            </div>
            <div class="inpu">
            <textarea class="opi" placeholder="Faça uma avaliação aqui. . ."></textarea>
            </div>

            <div class="dois">
              <div class="inpud">
                <div class="taa">
                <span>Tags</span>
                  <span>max: 8</span>
                  </div>
                <input type="text" class="in" placeholder="Ex: Terror" />
                <div class="tags"></div>
              </div>

              <div class="vi">
                <input type="checkbox" />
                <span>Já vi antes</span>
              </div>
            </div>
          </div>
        </div>
        <div class="enviar">
          <button class="save">Salvar</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
